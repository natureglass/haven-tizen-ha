<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, user-scalable=no">
    <title>Haven</title>
    <!-- Shell styles only. The design's own CSS is loaded by shell/boot.js. -->
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
        #haven-notice {
            position: absolute; left: 50%; bottom: 40px; max-width: 1400px; padding: 16px 30px;
            background: #1b2233; color: #fff; border: 2px solid rgba(255, 255, 255, 0.15); border-radius: 18px;
            font: 24px "SamsungOne", "Tizen Sans", "Segoe UI", Roboto, sans-serif;
            opacity: 0; transform: translate3d(-50%, 20px, 0); transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none; z-index: 1000;
        }
        #haven-notice.show { opacity: 1; transform: translate3d(-50%, 0, 0); }
    </style>
</head>
<body>
<div id="stage"></div>
<div id="haven-notice"></div>

<!-- Samsung's TV APIs (AVPlay for camera streams). Resolved by the TV; absent in a desktop browser. -->
<script src="$WEBAPIS/webapis/webapis.js"></script>
<script src="shell-config.js"></script>
<script src="img/walls.js"></script>
<script src="shell/boot.js"></script>
</body>
</html>
